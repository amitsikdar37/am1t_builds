<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Immersive 3D IMAX Theatre Web Video Player - local cinema experience">
  <title>IMAX Theatre - WebPlayer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- LOADING SCREEN -->
<div id="loading-screen">
  <div id="curtain-left"></div>
  <div id="curtain-right"></div>
  <div id="loading-center">
    <div class="imax-brand">IMAX</div>
    <div class="loading-subtitle">Preparing your experience</div>
    <div class="loading-bar-wrap"><div class="loading-bar-inner" id="loading-bar"></div></div>
  </div>
</div>

<!-- WELCOME SCREEN -->
<div id="welcome-screen" style="display:none">
  <div id="drop-zone">
    <h1 class="welcome-title">IMAX Media Library</h1>
    <p class="welcome-subtitle">Select a movie from your local server</p>
    <div id="movie-grid" class="movie-grid">
      <div class="loading-spinner">Loading movies...</div>
    </div>
  </div>
</div>

<!-- CANVAS -->
<canvas id="theatre-canvas"></canvas>
<video id="cinema-video" preload="metadata" playsinline></video>

<!-- BUFFERING -->
<div id="buffering-overlay" style="display:none">
  <div class="film-reel">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" stroke="#c8a96e" stroke-width="2" fill="none" stroke-dasharray="263" stroke-dashoffset="66" opacity="0.4"/>
      <circle cx="50" cy="50" r="28" stroke="#c8a96e" stroke-width="2" fill="none"/>
      <circle cx="50" cy="50" r="9" fill="#c8a96e"/>
      <circle cx="50" cy="22" r="6" fill="#c8a96e" opacity="0.7"/>
      <circle cx="73.2" cy="65" r="6" fill="#c8a96e" opacity="0.7"/>
      <circle cx="26.8" cy="65" r="6" fill="#c8a96e" opacity="0.7"/>
    </svg>
  </div>
  <p>Loading...</p>
</div>

<!-- ERROR TOAST -->
<div id="error-toast" class="toast" style="display:none"><span id="error-msg">Error</span></div>

<!-- HUD -->
<div id="hud" class="hud-hidden">
  <div id="hud-top">
    <div class="hud-file-info">
      <span class="hud-icon">FILM</span>
      <span id="hud-filename">No file loaded</span>
    </div>
    <div class="hud-right-top">
      <span class="quality-badge">IMAX</span>
      <span id="fps-counter" class="fps">60 fps</span>
    </div>
  </div>
  <div id="seek-container">
    <div id="seek-bar-wrap">
      <div id="seek-buffered"></div>
      <div id="seek-progress"></div>
      <input type="range" id="seek-bar" min="0" max="10000" value="0" step="1">
    </div>
  </div>
  <div id="hud-bottom">
    <div class="hud-left">
      <button id="open-btn" class="ctrl-btn" title="Open file (O)">
        <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V6h5.17l2 2H20v10z"/></svg>
      </button>
      <button id="seek-back-btn" class="ctrl-btn" title="Back 10s">
        <svg viewBox="0 0 24 24"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
      <button id="play-btn" class="ctrl-btn play-btn" title="Play/Pause (Space)">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="seek-fwd-btn" class="ctrl-btn" title="Forward 10s">
        <svg viewBox="0 0 24 24"><path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
      </button>
      <div class="time-display">
        <span id="current-time">0:00:00</span>
        <span class="time-sep">/</span>
        <span id="total-time">0:00:00</span>
      </div>
    </div>
    <div class="hud-center">
      <button id="mute-btn" class="ctrl-btn" title="Mute (M)">
        <svg id="vol-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg id="muted-icon" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <div class="volume-wrap"><input type="range" id="volume-bar" min="0" max="100" value="100"></div>
    </div>
    <div class="hud-right">
      <button id="subs-btn" class="ctrl-btn" title="Subtitles & Audio">
        <svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1.5c0 .28-.22.5-.5.5h-3c-.28 0-.5-.22-.5-.5v-4c0-.28.22-.5.5-.5h3c.28 0 .5.22.5.5V11zm7 0h-1.5v-.5h-2v3h2V13H18v1.5c0 .28-.22.5-.5.5h-3c-.28 0-.5-.22-.5-.5v-4c0-.28.22-.5.5-.5h3c.28 0 .5.22.5.5V11z"/></svg>
      </button>
      <select id="seat-select" class="ctrl-select" title="Change Seat">
        <option value="center" selected>Middle Center</option>
        <option value="front">Front Row</option>
        <option value="back">Back Row</option>
        <option value="side">Left Side</option>
      </select>
      <select id="speed-select" class="ctrl-select">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option><option value="1" selected>1x</option>
        <option value="1.25">1.25x</option><option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
      <button id="lights-btn" class="ctrl-btn" title="Theatre lights (L)">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7zm2 14h-4v-1h4v1zm0-3H10v-1.5c-1.19-.45-2-1.6-2-2.5 0-1.66 1.34-3 3-3s3 1.34 3 3c0 .9-.81 2.05-2 2.5V13z"/></svg>
      </button>
      <button id="fullscreen-btn" class="ctrl-btn" title="Fullscreen (F)">
        <svg id="fs-expand" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <svg id="fs-collapse" viewBox="0 0 24 24" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="tracks-menu" class="track-menu-container">
  <h3>Audio Tracks</h3>
  <div id="audio-list"></div>
  <h3 style="margin-top:10px">Subtitles</h3>
  <div id="sub-list"></div>
</div>

<div id="drag-hint">Drag to look around the cinema</div>

<script type="module" src="js/main.js?v=16"></script>
</body>
</html>
