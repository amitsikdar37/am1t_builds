<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Memory Museum</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* The spacer's scrollbar would otherwise steal ~15px of layout width on
       desktop while the renderer sizes to window.innerWidth, leaving the
       canvas overhanging. Nothing here is meant to be read as a scrollbar
       anyway — the scroll hint does that job. The rule has to name `html` as
       well: the viewport scrollbar is generated by the root element, and a
       `body`-only rule leaves it in place. */
    html, body {
      scrollbar-width: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar { display: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a12;
      color: #e8e8f0;
      overflow-x: hidden;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      z-index: 1;
    }
    #scroll-spacer {
      position: relative;
      width: 100%;
      height: 300dvh;
      pointer-events: none;
      z-index: 2;
    }
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: radial-gradient(circle at center, #1a1530, #0a0612);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.6s ease;
    }
    #intro-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .intro-name {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      color: #d4a24c;
      margin-bottom: 1.5rem;
      text-align: center;
      padding: 0 1rem;
    }
    .intro-subtitle {
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      color: #a8a8c0;
      margin-bottom: 3rem;
      text-align: center;
      padding: 0 1rem;
    }
    #enter-btn {
      padding: 1rem 3rem;
      font-size: 1.1rem;
      background: linear-gradient(135deg, #d4a24c, #b88a3c);
      color: #0a0612;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 24px rgba(212, 162, 76, 0.3);
    }
    #enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(212, 162, 76, 0.4);
    }
    #enter-btn:active {
      transform: translateY(0);
    }
    .progress-bar {
      width: 200px;
      height: 3px;
      background: #2a2540;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2rem;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d4a24c, #f0c070);
      transition: width 0.3s ease;
    }
    #hud {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      padding: 0.8rem 1.5rem;
      border-radius: 12px;
    }
    #hud.visible {
      opacity: 1;
    }
    .scroll-hint {
      font-size: 0.9rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    .caption {
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: #ffd580;
      font-weight: 400;
      letter-spacing: 0.05em;
    }
    #interaction-hint {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -8px);
      z-index: 55;
      padding: 0.55rem 0.9rem;
      border: 1px solid rgba(255, 213, 128, 0.34);
      border-radius: 999px;
      background: rgba(18, 12, 25, 0.76);
      backdrop-filter: blur(8px);
      color: #ffe0a0;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }
    #interaction-hint.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    #close-focus-btn {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      right: max(1rem, env(safe-area-inset-right));
      z-index: 70;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 224, 160, 0.45);
      border-radius: 50%;
      background: rgba(18, 12, 25, 0.82);
      color: #fff1d2;
      font-size: 1.45rem;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      transform: scale(0.85);
    }
    #close-focus-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }
    #cake-view-btn {
      position: fixed;
      top: max(1rem, env(safe-area-inset-top));
      left: max(1rem, env(safe-area-inset-left));
      z-index: 70;
      padding: 0.65rem 0.9rem;
      border: 1px solid rgba(255, 224, 160, 0.45);
      border-radius: 999px;
      background: rgba(18, 12, 25, 0.82);
      color: #fff1d2;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.25s, transform 0.25s;
    }
    #cake-view-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    #finale-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: rgba(10, 6, 18, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      padding: 2rem;
    }
    #finale-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }
    .finale-card {
      width: min(680px, 100%);
      max-height: min(78dvh, 720px);
      overflow: auto;
      padding: clamp(2rem, 6vw, 4rem);
      border: 1px solid rgba(212, 162, 76, 0.55);
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(212, 162, 76, 0.14), transparent 45%),
        rgba(24, 17, 35, 0.96);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(212, 162, 76, 0.05);
      text-align: center;
      transform: translateY(24px) scale(0.96);
      transition: transform 0.8s cubic-bezier(.2,.8,.2,1);
    }
    #finale-overlay.visible .finale-card {
      transform: translateY(0) scale(1);
    }
    .finale-title {
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 300;
      color: #d4a24c;
      margin-bottom: 2rem;
      text-align: center;
    }
    .finale-letter {
      max-width: 600px;
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.8;
      color: #e8e8f0;
      text-align: center;
      margin-bottom: 3rem;
      white-space: pre-wrap;
    }
    #blow-prompt {
      position: fixed;
      bottom: max(1rem, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 150;
      background: rgba(26, 21, 48, 0.95);
      padding: 1.25rem 1.5rem;
      border-radius: 16px;
      border: 2px solid #d4a24c;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      max-width: 90%;
      width: min(520px, calc(100% - 2rem));
    }
    #blow-prompt.visible {
      opacity: 1;
      pointer-events: all;
    }
    .blow-title {
      font-size: 1.5rem;
      color: #d4a24c;
      margin-bottom: 1rem;
    }
    .blow-instruction {
      font-size: 1rem;
      color: #a8a8c0;
      margin-bottom: 1.5rem;
    }
    .blow-btn {
      padding: 0.8rem 2rem;
      background: linear-gradient(135deg, #d4a24c, #b88a3c);
      color: #0a0612;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      margin: 0.5rem;
      transition: transform 0.2s;
    }
    .blow-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div id="intro-screen">
    <h1 class="intro-name" id="intro-name">Loading...</h1>
    <p class="intro-subtitle">Your birthday memory museum awaits</p>
    <button id="enter-btn">Tap to Enter</button>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div id="canvas-container"></div>
  <div id="scroll-spacer"></div>

  <div id="hud">
    <div class="scroll-hint">Scroll to explore</div>
    <div class="caption" id="caption"></div>
  </div>

  <div id="interaction-hint" aria-live="polite"></div>
  <button id="close-focus-btn" aria-label="Close photo close-up">×</button>
  <button id="cake-view-btn" aria-label="Toggle cake camera view">Top view</button>

  <div id="blow-prompt">
    <div class="blow-title">🎂 Make a Wish!</div>
    <div class="blow-instruction" aria-live="polite">Blow into your microphone — or use the tap fallback</div>
    <button class="blow-btn" id="allow-mic-btn">Allow Microphone</button>
    <button class="blow-btn" id="tap-blow-btn" style="display:none;">Tap to Blow</button>
  </div>

  <div id="finale-overlay">
    <div class="finale-card">
      <h1 class="finale-title" id="finale-title">Happy Birthday!</h1>
      <div class="finale-letter" id="finale-letter"></div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
